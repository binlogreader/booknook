[package]
name = "booknook"
version = "0.1.0"
edition = "2024"

[dependencies]
# The OpenGL renderer rather than eframe's default, wgpu. A reading window has
# no use for a modern GPU pipeline, and glow leaves a few dozen crates out of
# the build and a few hundred megabytes out of memory at rest.
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
pulldown-cmark = "0.12"
anyhow = "1.0"
unicode-width = "0.2"
dirs = "5"
ureq = "2"
sha2 = "0.10"
epub = "2"
quick-xml = "0.37"
serde_json = "1.0.150"
htmd = "0.5.4"
